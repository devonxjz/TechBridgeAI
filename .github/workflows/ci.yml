name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect research gateway Worker
        id: worker
        shell: bash
        run: |
          if [[ -f workers/research-gateway/package.json ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Worker dependencies
        if: steps.worker.outputs.enabled == 'true'
        run: npm ci --prefix workers/research-gateway

      - name: Check Worker
        if: steps.worker.outputs.enabled == 'true'
        run: npm run worker:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Database integration tests
        run: |
          npx supabase start
          eval "$(npx supabase status -o env)"
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_TEST_ANON_KEY="$ANON_KEY" npm run test:db

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

      - name: Build
        run: npm run build

